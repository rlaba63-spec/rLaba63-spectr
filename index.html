<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Астроконсультант - Анкета</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Стили можно оставить те же, что и в вашей боевой форме */
        /* ... (копируем стили из предыдущей версии) ... */
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Астроконсультант 🔮</h1>
            <div class="subtitle">
                Заполните анкету для получения персонального прогноза
            </div>
        </div>

        <form id="astroForm" class="form" novalidate>
            <!-- Поля формы - те же -->
            <div class="field">
                <label class="field-label required">Ваше имя</label>
                <input type="text" id="name" class="field-input" required>
            </div>

            <div class="field">
                <label class="field-label required">Дата рождения</label>
                <input type="text" id="birthday" class="field-input" placeholder="ДД.ММ.ГГГГ" required>
            </div>

            <div class="field">
                <label class="field-label">Время рождения</label>
                <input type="text" id="birthtime" class="field-input" placeholder="ЧЧ:ММ">
            </div>

            <div class="field">
                <label class="field-label required">Место рождения</label>
                <input type="text" id="birthplace" class="field-input" required>
            </div>

            <div class="field">
                <label class="field-label required">Ваш пол</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="gender" value="male" required>
                        <span>👨 Мужчина</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="gender" value="female" required>
                        <span>👩 Женщина</span>
                    </label>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span id="btnText">Получить прогноз</span>
            </button>
            <div id="statusMessage" class="status"></div>
        </form>
    </div>

    <script>
        (function() {
            'use strict';

            const webApp = window.Telegram.WebApp;
            webApp.ready();
            webApp.expand();

            const elements = {
                form: document.getElementById('astroForm'),
                submitBtn: document.getElementById('submitBtn'),
                btnText: document.getElementById('btnText'),
                status: document.getElementById('statusMessage'),
                
                name: document.getElementById('name'),
                birthday: document.getElementById('birthday'),
                birthtime: document.getElementById('birthtime'),
                birthplace: document.getElementById('birthplace')
            };

            function showStatus(message, type = 'info') {
                elements.status.className = 'status ' + type;
                elements.status.textContent = message;
            }

            function setLoading(loading) {
                elements.submitBtn.disabled = loading;
                elements.btnText.innerHTML = loading ? 'Отправка...' : 'Получить прогноз';
            }

            function getFormData() {
                const genderInput = document.querySelector('input[name="gender"]:checked');
                
                return {
                    name: elements.name.value.trim(),
                    birthday: elements.birthday.value,
                    birthtime: elements.birthtime.value || null,
                    birthplace: elements.birthplace.value.trim(),
                    gender: genderInput ? (genderInput.value === 'male' ? 'Мужчина' : 'Женщина') : null,
                    user_id: webApp.initDataUnsafe.user?.id || null,
                    username: webApp.initDataUnsafe.user?.username || null,
                    source: 'telegram_web_app',
                    timestamp: new Date().toISOString()
                };
            }

            elements.form.addEventListener('submit', (e) => {
                e.preventDefault();

                if (elements.submitBtn.disabled) return;

                const formData = getFormData();
                
                setLoading(true);
                showStatus('Отправка...', 'info');

                try {
                    // ⭐ Отправляем данные через Telegram Web App API
                    webApp.sendData(JSON.stringify(formData));
                    
                    showStatus('✅ Данные отправлены!', 'success');
                    
                    // Закрываем через 1.5 секунды
                    setTimeout(() => webApp.close(), 1500);
                    
                } catch (error) {
                    console.error('Send error:', error);
                    showStatus('❌ Ошибка отправки', 'error');
                    setLoading(false);
                }
            });

            // Форматирование даты и времени
            elements.birthday.addEventListener('input', (e) => {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length >= 2 && value.length < 4) {
                    value = value.slice(0, 2) + '.' + value.slice(2);
                } else if (value.length >= 4) {
                    value = value.slice(0, 2) + '.' + value.slice(2, 4) + '.' + value.slice(4, 8);
                }
                e.target.value = value;
            });

            elements.birthtime.addEventListener('input', (e) => {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length >= 2) {
                    value = value.slice(0, 2) + ':' + value.slice(2, 4);
                }
                e.target.value = value;
            });

        })();
    </script>
</body>
</html>
