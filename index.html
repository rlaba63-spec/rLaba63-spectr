<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Астроконсультант - Анкета (Отладка)</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
            line-height: 1.4;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .greeting {
            font-size: 16px;
            margin-bottom: 24px;
            color: var(--tg-theme-hint-color, #999999);
            padding-bottom: 16px;
            border-bottom: 1px solid var(--tg-theme-hint-color, #eeeeee);
        }
        .field {
            margin-bottom: 24px;
        }
        .field-label {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        .field-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--tg-theme-hint-color, #dddddd);
            border-radius: 8px;
            font-size: 16px;
            background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000000);
            box-sizing: border-box;
        }
        .radio-group {
            display: flex;
            gap: 24px;
            padding: 8px 0;
        }
        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .submit-btn {
            width: 100%;
            padding: 16px;
            background-color: var(--tg-theme-button-color, #40a7e3);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 24px;
            margin-bottom: 16px;
        }
        .submit-btn.secondary {
            background-color: #666;
        }
        .submit-btn.warning {
            background-color: #ff9800;
        }
        .webhook-status {
            padding: 8px 12px;
            margin: 10px 0;
            border-radius: 8px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .webhook-status.primary {
            background-color: #e3f2fd;
            border: 1px solid #2196f3;
        }
        .webhook-status.test {
            background-color: #fff3e0;
            border: 1px solid #ff9800;
        }
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-indicator.active {
            background-color: #4caf50;
        }
        .status-indicator.inactive {
            background-color: #f44336;
        }
        .divider {
            height: 1px;
            background-color: var(--tg-theme-hint-color, #eeeeee);
            margin: 24px 0;
        }
        .debug-panel {
            background-color: #f0f0f0;
            border-radius: 8px;
            padding: 12px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 12px;
            color: #333;
            max-height: 200px;
            overflow-y: auto;
        }
        .debug-panel div {
            margin: 4px 0;
            border-bottom: 1px solid #ddd;
            padding: 4px;
        }
        .status-message {
            text-align: center;
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }
        .status-success {
            background-color: #4caf50;
            color: white;
            display: block;
        }
        .status-error {
            background-color: #f44336;
            color: white;
            display: block;
        }
        .status-info {
            background-color: #2196f3;
            color: white;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Астроконсультант 🔮 (Отладка)</h1>
        <div class="greeting">
            Заполните данные для тестирования отправки
        </div>

        <!-- Индикатор статуса вебхуков -->
        <div id="primaryWebhookStatus" class="webhook-status primary">
            <span>
                <span class="status-indicator" id="primaryIndicator"></span>
                Основной вебхук
            </span>
            <span id="primaryStatusText">Проверка...</span>
        </div>
        <div id="testWebhookStatus" class="webhook-status test">
            <span>
                <span class="status-indicator" id="testIndicator"></span>
                Тестовый вебхук
            </span>
            <span id="testStatusText">Проверка...</span>
        </div>

        <form id="astroForm">
            <!-- Поля формы -->
            <div class="field">
                <div class="field-label">Ваше имя:</div>
                <input type="text" id="name" class="field-input" value="Тест" required>
            </div>

            <div class="field">
                <div class="field-label">Дата рождения:</div>
                <input type="text" id="birthday" class="field-input" value="01.01.1990" required>
            </div>

            <div class="field">
                <div class="field-label">Место рождения:</div>
                <input type="text" id="birthplace" class="field-input" value="Москва" required>
            </div>

            <div class="field">
                <div class="field-label">Ваш пол:</div>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="gender" value="male" checked>
                        <span>Мужчина</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="gender" value="female">
                        <span>Женщина</span>
                    </label>
                </div>
            </div>

            <div class="divider"></div>

            <!-- Кнопки для разных способов отправки -->
            <button type="button" class="submit-btn" id="sendToN8nBtn">📤 Отправить в n8n (с авто-переключением)</button>
            <button type="button" class="submit-btn secondary" id="sendToTelegramBtn">📱 Отправить в Telegram</button>
            <button type="button" class="submit-btn warning" id="forceSwitchBtn">🔄 Принудительно переключить на тестовый</button>
            
            <div id="statusMessage" class="status-message"></div>
            
            <!-- Панель отладки -->
            <div class="debug-panel" id="debugPanel">
                <div><strong>📋 Лог отладки:</strong></div>
                <div id="logMessages">Ожидание действий...</div>
            </div>
        </form>
    </div>

    <script>
        const webApp = window.Telegram.WebApp;
        webApp.ready();
        webApp.expand();

        // ⚠️ НАСТРОЙКА ВЕБХУКОВ
        const WEBHOOKS = {
            primary: 'https://nx8.zaltrix.org/webhook/telegram-form',  // Основной вебхук
            test: 'https://nx8.zaltrix.org/webhook-test/telegram-form'  // Тестовый вебхук
        };

        // Текущий активный вебхук (начинаем с основного)
        let currentWebhook = WEBHOOKS.primary;
        let usingTestWebhook = false;

        // Элементы для отображения статуса
        const primaryIndicator = document.getElementById('primaryIndicator');
        const testIndicator = document.getElementById('testIndicator');
        const primaryStatusText = document.getElementById('primaryStatusText');
        const testStatusText = document.getElementById('testStatusText');
        const debugPanel = document.getElementById('debugPanel');
        const statusMessage = document.getElementById('statusMessage');

        // Функция для логирования
        function log(message, data = null) {
            const timestamp = new Date().toLocaleTimeString();
            let logText = `[${timestamp}] ${message}`;
            if (data) {
                logText += `\n${JSON.stringify(data, null, 2)}`;
            }
            
            const newLog = document.createElement('div');
            newLog.textContent = logText;
            debugPanel.appendChild(newLog);
            debugPanel.scrollTop = debugPanel.scrollHeight;
            
            console.log(logText, data);
        }

        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = 'status-message status-' + type;
            log(`Статус: ${message}`, {type});
        }

        // Функция проверки доступности вебхука
        async function checkWebhookHealth(url, timeout = 3000) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), timeout);
                
                const response = await fetch(url, {
                    method: 'HEAD',
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                return response.status < 500; // Считаем доступным если нет серверной ошибки
            } catch (error) {
                return false;
            }
        }

        // Обновление статуса вебхуков
        async function updateWebhookStatus() {
            log('🔄 Проверка доступности вебхуков...');
            
            const [primaryHealthy, testHealthy] = await Promise.all([
                checkWebhookHealth(WEBHOOKS.primary),
                checkWebhookHealth(WEBHOOKS.test)
            ]);

            // Обновляем индикаторы основного вебхука
            primaryIndicator.className = `status-indicator ${primaryHealthy ? 'active' : 'inactive'}`;
            primaryStatusText.textContent = primaryHealthy ? 'Доступен' : 'Недоступен';

            // Обновляем индикаторы тестового вебхука
            testIndicator.className = `status-indicator ${testHealthy ? 'active' : 'inactive'}`;
            testStatusText.textContent = testHealthy ? 'Доступен' : 'Недоступен';

            // Автоматическое переключение на тестовый если основной недоступен
            if (!primaryHealthy && testHealthy && !usingTestWebhook) {
                log('⚠️ Основной вебхук недоступен, переключаемся на тестовый');
                switchToTestWebhook();
            } else if (primaryHealthy && usingTestWebhook) {
                log('✅ Основной вебхук снова доступен, переключаемся обратно');
                switchToPrimaryWebhook();
            }

            log('📊 Статус вебхуков:', {
                primary: primaryHealthy ? 'доступен' : 'недоступен',
                test: testHealthy ? 'доступен' : 'недоступен',
                current: usingTestWebhook ? 'тестовый' : 'основной'
            });

            return { primaryHealthy, testHealthy };
        }

        // Переключение на тестовый вебхук
        function switchToTestWebhook() {
            currentWebhook = WEBHOOKS.test;
            usingTestWebhook = true;
            
            // Визуальное выделение активного вебхука
            document.getElementById('primaryWebhookStatus').style.opacity = '0.5';
            document.getElementById('testWebhookStatus').style.opacity = '1';
            
            showStatus('🔄 Переключено на ТЕСТОВЫЙ вебхук', 'info');
            log('🔄 Активный вебхук: ТЕСТОВЫЙ');
        }

        // Переключение на основной вебхук
        function switchToPrimaryWebhook() {
            currentWebhook = WEBHOOKS.primary;
            usingTestWebhook = false;
            
            // Визуальное выделение активного вебхука
            document.getElementById('primaryWebhookStatus').style.opacity = '1';
            document.getElementById('testWebhookStatus').style.opacity = '0.5';
            
            showStatus('🔄 Переключено на ОСНОВНОЙ вебхук', 'info');
            log('🔄 Активный вебхук: ОСНОВНОЙ');
        }

        // Функция сбора данных из формы
        function getFormData() {
            const genderElement = document.querySelector('input[name="gender"]:checked');
            
            return {
                name: document.getElementById('name').value,
                birthday: document.getElementById('birthday').value,
                birthplace: document.getElementById('birthplace').value,
                gender: genderElement ? (genderElement.value === 'male' ? 'Мужчина' : 'Женщина') : 'не указан',
                user_id: webApp.initDataUnsafe.user?.id || 'unknown',
                username: webApp.initDataUnsafe.user?.username || 'не указан',
                chat_id: webApp.initDataUnsafe.user?.id,
                source: 'telegram_web_app',
                timestamp: new Date().toISOString(),
                used_webhook: usingTestWebhook ? 'test' : 'primary' // Отмечаем какой вебхук использован
            };
        }

        // Отправка в n8n с автоматическим переключением
        async function sendToN8n() {
            const formData = getFormData();
            
            log('🚀 Начинаем отправку...', formData);
            log('🔗 Текущий вебхук:', currentWebhook);
            
            showStatus('Отправка...', 'info');

            try {
                // Сначала пробуем отправить на текущий вебхук
                log('📡 Отправка на текущий вебхук...');
                
                const response = await fetch(currentWebhook, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                log('📥 Получен ответ от сервера', {
                    status: response.status,
                    statusText: response.statusText,
                    ok: response.ok,
                    webhook: usingTestWebhook ? 'test' : 'primary'
                });

                if (response.ok) {
                    const responseText = await response.text();
                    log('✅ Успех! Ответ сервера:', responseText);
                    showStatus('✅ Данные отправлены!', 'success');
                    
                    setTimeout(() => webApp.close(), 2000);
                } else {
                    // Если текущий вебхук вернул ошибку, пробуем переключиться
                    if (!usingTestWebhook) {
                        log('⚠️ Ошибка на основном вебхуке, пробуем тестовый...');
                        switchToTestWebhook();
                        
                        // Повторная отправка на тестовый
                        const retryResponse = await fetch(currentWebhook, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify(formData)
                        });

                        if (retryResponse.ok) {
                            const responseText = await retryResponse.text();
                            log('✅ Успех на тестовом вебхуке!', responseText);
                            showStatus('✅ Данные отправлены через тестовый вебхук!', 'success');
                        } else {
                            throw new Error(`Ошибка ${retryResponse.status}`);
                        }
                    } else {
                        throw new Error(`Ошибка ${response.status}`);
                    }
                }
            } catch (error) {
                log('❌ Критическая ошибка при отправке:', {
                    name: error.name,
                    message: error.message
                });
                
                // Если ошибка и мы ещё не пробовали тестовый
                if (!usingTestWebhook) {
                    log('⚠️ Пробуем переключиться на тестовый вебхук...');
                    switchToTestWebhook();
                    
                    // Пробуем отправить ещё раз
                    try {
                        const retryResponse = await fetch(currentWebhook, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify(formData)
                        });

                        if (retryResponse.ok) {
                            const responseText = await retryResponse.text();
                            log('✅ Успех на тестовом вебхуке после ошибки!', responseText);
                            showStatus('✅ Данные отправлены через тестовый вебхук!', 'success');
                            return;
                        }
                    } catch (retryError) {
                        log('❌ И тестовый вебхук недоступен', retryError);
                    }
                }
                
                showStatus(`❌ Ошибка: ${error.message}`, 'error');
            }
        }

        // Отправка в Telegram (старый способ)
        function sendToTelegram() {
            const formData = getFormData();
            
            log('📱 Отправка в Telegram (sendData)...', formData);
            showStatus('Отправка в Telegram...', 'info');
            
            try {
                webApp.sendData(JSON.stringify(formData));
                log('✅ sendData выполнен успешно');
                showStatus('✅ Данные отправлены в Telegram!', 'success');
                
                setTimeout(() => webApp.close(), 1500);
            } catch (error) {
                log('❌ Ошибка sendData:', error);
                showStatus('❌ Ошибка отправки в Telegram', 'error');
            }
        }

        // Навешиваем обработчики
        document.getElementById('sendToN8nBtn').addEventListener('click', sendToN8n);
        document.getElementById('sendToTelegramBtn').addEventListener('click', sendToTelegram);
        document.getElementById('forceSwitchBtn').addEventListener('click', () => {
            if (usingTestWebhook) {
                switchToPrimaryWebhook();
            } else {
                switchToTestWebhook();
            }
            updateWebhookStatus();
        });

        // Логируем информацию о запуске
        log('✅ Web App инициализирован');
        log('👤 Данные пользователя:', webApp.initDataUnsafe.user);
        log('🔗 Основной вебхук:', WEBHOOKS.primary);
        log('🔗 Тестовый вебхук:', WEBHOOKS.test);

        // Периодическая проверка статуса вебхуков
        updateWebhookStatus();
        setInterval(updateWebhookStatus, 30000); // Проверка каждые 30 секунд

    </script>
</body>
</html>
