<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Астроконсультант - Анкета</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 16px;
            width: 100%;
            flex: 1;
        }

        .header {
            margin-bottom: 24px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--tg-theme-text-color, #000) 0%, var(--tg-theme-hint-color, #666) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 16px;
            color: var(--tg-theme-hint-color, #666666);
            line-height: 1.5;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--tg-theme-hint-color, #e0e0e0);
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field-label {
            font-size: 15px;
            font-weight: 600;
            color: var(--tg-theme-text-color, #000000);
        }

        .field-label.required::after {
            content: "*";
            color: #ff4d4d;
            margin-left: 4px;
        }

        .field-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 14px;
            font-size: 16px;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000000);
            transition: all 0.2s ease;
            outline: none;
        }

        .field-input:focus {
            border-color: var(--tg-theme-button-color, #40a7e3);
            background: var(--tg-theme-bg-color, #ffffff);
        }

        .field-input.error {
            border-color: #ff4d4d;
        }

        .field-hint {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #999999);
            margin-top: 4px;
        }

        .field-error {
            font-size: 13px;
            color: #ff4d4d;
            margin-top: 4px;
            display: none;
        }

        .field-error.visible {
            display: block;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            padding: 8px 0;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            flex: 1;
        }

        .radio-option input[type="radio"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--tg-theme-button-color, #40a7e3);
        }

        .radio-option span {
            font-size: 16px;
            color: var(--tg-theme-text-color, #000000);
        }

        .status {
            margin: 20px 0;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 500;
            text-align: center;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .status.success {
            background: #4caf50;
            color: white;
            display: block;
        }

        .status.error {
            background: #ff4d4d;
            color: white;
            display: block;
        }

        .status.info {
            background: var(--tg-theme-button-color, #40a7e3);
            color: white;
            display: block;
        }

        .status.warning {
            background: #ff9800;
            color: white;
            display: block;
        }

        .debug-panel {
            margin-top: 30px;
            padding: 16px;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 14px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }

        .debug-panel.visible {
            display: block;
        }

        .debug-panel div {
            padding: 4px 0;
            border-bottom: 1px solid var(--tg-theme-hint-color, #ddd);
            color: var(--tg-theme-text-color, #333);
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: var(--tg-theme-button-color, #40a7e3);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(64, 167, 227, 0.3);
        }

        .submit-btn:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        .test-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .test-btn {
            flex: 1;
            padding: 12px;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000);
            border: none;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Астроконсультант 🔮</h1>
            <div class="subtitle">
                Заполните анкету для получения персонального прогноза
            </div>
        </div>

        <form id="astroForm" class="form" novalidate>
            <!-- Имя -->
            <div class="field">
                <label class="field-label required">Ваше имя</label>
                <input type="text" id="name" class="field-input" placeholder="Введите ваше имя" value="Тест" required>
                <div class="field-error" id="nameError">Пожалуйста, укажите ваше имя</div>
            </div>

            <!-- Дата рождения -->
            <div class="field">
                <label class="field-label required">Дата рождения</label>
                <input type="text" id="birthday" class="field-input" placeholder="ДД.ММ.ГГГГ" value="01.01.1990" required>
                <div class="field-hint">Формат: ДД.ММ.ГГГГ</div>
                <div class="field-error" id="birthdayError">Введите дату в формате ДД.ММ.ГГГГ</div>
            </div>

            <!-- Место рождения -->
            <div class="field">
                <label class="field-label required">Место рождения</label>
                <input type="text" id="birthplace" class="field-input" placeholder="Город, страна" value="Москва" required>
                <div class="field-error" id="birthplaceError">Укажите место рождения</div>
            </div>

            <!-- Пол -->
            <div class="field">
                <label class="field-label required">Ваш пол</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="gender" value="male" checked required>
                        <span>👨 Мужчина</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="gender" value="female" required>
                        <span>👩 Женщина</span>
                    </label>
                </div>
                <div class="field-error" id="genderError">Укажите ваш пол</div>
            </div>

            <!-- Статус -->
            <div id="statusMessage" class="status"></div>

            <!-- Кнопки тестирования -->
            <div class="test-buttons">
                <button type="button" class="test-btn" id="testWebhookBtn">🔍 Тест вебхука</button>
                <button type="button" class="test-btn" id="testCorsBtn">🌐 Тест CORS</button>
            </div>

            <!-- Панель отладки -->
            <div id="debugPanel" class="debug-panel">
                <div><strong>📋 Лог отладки:</strong></div>
                <div id="logMessages">Ожидание действий...</div>
            </div>

            <!-- Кнопка отправки -->
            <button type="submit" class="submit-btn" id="submitBtn">
                <span id="btnText">Получить прогноз</span>
            </button>
        </form>
    </div>

    <script>
        (function() {
            'use strict';

            const webApp = window.Telegram.WebApp;
            webApp.ready();
            webApp.expand();

            // ⚠️ ВАШ URL ВЕБХУКА - УБЕДИТЕСЬ ЧТО ОН ПРАВИЛЬНЫЙ!
            const WEBHOOK_URL = 'https://nx8.zaltrix.org/webhook/telegram-form';
            
            // Альтернативные URL для тестирования
            const TEST_URLS = {
                webhook: WEBHOOK_URL,
                test: WEBHOOK_URL.replace('/webhook/', '/webhook-test/')
            };

            const elements = {
                form: document.getElementById('astroForm'),
                submitBtn: document.getElementById('submitBtn'),
                btnText: document.getElementById('btnText'),
                status: document.getElementById('statusMessage'),
                debugPanel: document.getElementById('debugPanel'),
                logMessages: document.getElementById('logMessages'),
                testWebhookBtn: document.getElementById('testWebhookBtn'),
                testCorsBtn: document.getElementById('testCorsBtn'),
                
                name: document.getElementById('name'),
                birthday: document.getElementById('birthday'),
                birthplace: document.getElementById('birthplace')
            };

            let isSubmitting = false;

            // Функция логирования
            function log(message, data = null) {
                const timestamp = new Date().toLocaleTimeString();
                const logEntry = document.createElement('div');
                
                let logText = `[${timestamp}] ${message}`;
                if (data) {
                    logText += `\n${JSON.stringify(data, null, 2)}`;
                }
                
                logEntry.textContent = logText;
                elements.logMessages.appendChild(logEntry);
                elements.debugPanel.classList.add('visible');
                elements.debugPanel.scrollTop = elements.debugPanel.scrollHeight;
                
                console.log(logText, data);
            }

            // Показать статус
            function showStatus(message, type = 'info') {
                elements.status.className = 'status ' + type;
                elements.status.textContent = message;
                log(`Статус: ${message}`, {type});
            }

            // Очистить статус
            function clearStatus() {
                elements.status.className = 'status';
                elements.status.textContent = '';
            }

            // Установка загрузки
            function setLoading(loading) {
                isSubmitting = loading;
                elements.submitBtn.disabled = loading;
                elements.btnText.innerHTML = loading ? 
                    '<span class="spinner"></span>Отправка...' : 
                    'Получить прогноз';
            }

            // Получить данные формы
            function getFormData() {
                const genderInput = document.querySelector('input[name="gender"]:checked');
                
                return {
                    name: elements.name.value.trim(),
                    birthday: elements.birthday.value,
                    birthplace: elements.birthplace.value.trim(),
                    gender: genderInput ? (genderInput.value === 'male' ? 'Мужчина' : 'Женщина') : null,
                    user_id: webApp.initDataUnsafe.user?.id || null,
                    username: webApp.initDataUnsafe.user?.username || null,
                    chat_id: webApp.initDataUnsafe.user?.id,
                    source: 'telegram_web_app',
                    timestamp: new Date().toISOString()
                };
            }

            // Функция проверки доступности вебхука (CORS preflight)
            async function testWebhookAvailability(url) {
                log(`🔄 Проверка доступности: ${url}`);
                
                try {
                    // Пробуем OPTIONS запрос для проверки CORS
                    const response = await fetch(url, {
                        method: 'OPTIONS',
                        mode: 'cors',
                        headers: {
                            'Origin': 'https://telegram.org',
                            'Access-Control-Request-Method': 'POST',
                            'Access-Control-Request-Headers': 'content-type'
                        }
                    });
                    
                    log('✅ Сервер доступен, CORS headers:', {
                        status: response.status,
                        headers: Object.fromEntries(response.headers.entries())
                    });
                    
                    return true;
                } catch (error) {
                    log('❌ Сервер НЕ доступен:', {
                        error: error.message,
                        name: error.name
                    });
                    return false;
                }
            }

            // Функция отправки данных
            async function sendData(url, data) {
                log('🚀 Начинаем отправку...', {url, data});

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => {
                        controller.abort();
                        log('⏱️ Таймаут запроса (10 сек)');
                    }, 10000);

                    const response = await fetch(url, {
                        method: 'POST',
                        mode: 'cors',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(data),
                        signal: controller.signal
                    });

                    clearTimeout(timeoutId);

                    log('📥 Получен ответ:', {
                        status: response.status,
                        statusText: response.statusText,
                        ok: response.ok,
                        headers: Object.fromEntries(response.headers.entries())
                    });

                    if (response.ok) {
                        const responseText = await response.text();
                        log('✅ Успех! Ответ:', responseText);
                        return { success: true, data: responseText };
                    } else {
                        const errorText = await response.text();
                        log('❌ Ошибка сервера:', {status: response.status, error: errorText});
                        return { success: false, error: `HTTP ${response.status}: ${errorText}` };
                    }

                } catch (error) {
                    log('❌ Критическая ошибка:', {
                        name: error.name,
                        message: error.message,
                        stack: error.stack
                    });
                    
                    if (error.name === 'AbortError') {
                        return { success: false, error: 'Таймаут запроса' };
                    }
                    if (error.name === 'TypeError' && error.message === 'Load failed') {
                        return { success: false, error: 'Load failed - сервер не отвечает или CORS блокировка' };
                    }
                    return { success: false, error: error.message };
                }
            }

            // Тест вебхука
            async function runWebhookTest() {
                clearStatus();
                log('🧪 ЗАПУСК ТЕСТА ВЕБХУКА');
                
                // Сначала проверяем доступность
                const isAvailable = await testWebhookAvailability(WEBHOOK_URL);
                
                if (!isAvailable) {
                    showStatus('❌ Сервер недоступен. Проверьте URL и CORS', 'error');
                    return;
                }
                
                // Отправляем тестовые данные
                const testData = {
                    test: true,
                    message: 'Тестовый запрос',
                    timestamp: new Date().toISOString()
                };
                
                const result = await sendData(WEBHOOK_URL, testData);
                
                if (result.success) {
                    showStatus('✅ Тест успешен! Сервер отвечает', 'success');
                } else {
                    showStatus(`❌ Тест не удался: ${result.error}`, 'error');
                }
            }

            // Тест CORS
            async function runCorsTest() {
                clearStatus();
                log('🌐 ТЕСТ CORS');
                
                try {
                    const response = await fetch('https://cors-test.codehappy.dev/test', {
                        method: 'GET',
                        mode: 'cors'
                    });
                    
                    log('✅ CORS работает:', {
                        status: response.status,
                        ok: response.ok
                    });
                    
                    showStatus('✅ CORS работает нормально', 'success');
                } catch (error) {
                    log('❌ Проблемы с CORS:', error.message);
                    showStatus('❌ Возможны проблемы с CORS', 'error');
                }
            }

            // Основная отправка формы
            elements.form.addEventListener('submit', async (e) => {
                e.preventDefault();

                if (isSubmitting) return;

                const formData = getFormData();
                log('📝 Форма заполнена', formData);

                setLoading(true);
                showStatus('Отправка данных...', 'info');

                const result = await sendData(WEBHOOK_URL, formData);

                if (result.success) {
                    showStatus('✅ Данные успешно отправлены!', 'success');
                    
                    // Блокируем форму
                    elements.form.querySelectorAll('input, button').forEach(el => {
                        el.disabled = true;
                    });
                    
                    // Отправляем в Telegram для надежности
                    try {
                        webApp.sendData(JSON.stringify({status: 'success', ...formData}));
                        log('📱 Данные продублированы в Telegram');
                    } catch (e) {
                        log('⚠️ Не удалось отправить в Telegram');
                    }
                    
                    setTimeout(() => webApp.close(), 2000);
                } else {
                    showStatus(`❌ Ошибка: ${result.error}`, 'error');
                    setLoading(false);
                }
            });

            // Кнопки тестирования
            elements.testWebhookBtn.addEventListener('click', runWebhookTest);
            elements.testCorsBtn.addEventListener('click', runCorsTest);

            // Автоформатирование даты
            elements.birthday.addEventListener('input', (e) => {
                let value = e.target.value.replace(/[^\d]/g, '');
                if (value.length >= 2 && value.length < 4) {
                    value = value.slice(0, 2) + '.' + value.slice(2);
                } else if (value.length >= 4) {
                    value = value.slice(0, 2) + '.' + value.slice(2, 4) + '.' + value.slice(4, 8);
                }
                e.target.value = value;
            });

            // Логируем запуск
            log('✅ Форма загружена', {
                user: webApp.initDataUnsafe.user,
                webhook: WEBHOOK_URL,
                platform: webApp.platform
            });

            // Автоматический тест при загрузке
            setTimeout(() => {
                testWebhookAvailability(WEBHOOK_URL);
            }, 1000);

        })();
    </script>
</body>
</html>
